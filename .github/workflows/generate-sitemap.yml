name: Generate Sitemap

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate sitemap.xml
        run: |
          python -c "
import os
import sys
from urllib.parse import quote

base_url = 'https://facedriverpins.github.io'
urls = []

for root, dirs, files in os.walk('.'):
    dirs[:] = [d for d in dirs if not d.startswith('.')]
    for file in files:
        if file.endswith('.html'):
            rel_path = os.path.join(root, file).lstrip('./')
            rel_path = rel_path.replace('\\', '/')
            # URL encode the path
            encoded_path = '/'.join(quote(part, safe='') for part in rel_path.split('/'))
            url = f'{base_url}/{encoded_path}'
            urls.append(url)

sitemap = '<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\">\n'
for url in sorted(urls):
    sitemap += f'  <url>\n    <loc>{url}</loc>\n  </url>\n'
sitemap += '</urlset>'

with open('sitemap.xml', 'w', encoding='utf-8') as f:
    f.write(sitemap)
print(f'Generated sitemap.xml with {len(urls)} URLs')
"

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-generate sitemap"
          file_pattern: sitemap.xml
