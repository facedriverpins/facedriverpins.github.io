name: Generate sitemap and submit to IndexNow

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  generate-and-submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate sitemap.xml
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: "https://facedriverpins.github.io/"
          path-to-root: "."
          include-patterns: "**/*.html, **/*.htm"
          include-patterns: "**/*.htm"
          exclude-patterns: "**/*.txt"

      - name: Commit and push sitemap.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --cached --quiet || git commit -m "Auto update sitemap.xml"
          git push

      - name: Submit sitemap to IndexNow
        uses: jakob-bagterp/index-now-submit-sitemap-action@v1
        with:
          host: "facedriverpins.github.io"
          api_key: ${{ secrets.INDEXNOW_KEY }}
          api_key_location: "https://facedriverpins.github.io/${{ secrets.INDEXNOW_KEY }}.txt"
          sitemap_locations: "https://facedriverpins.github.io/sitemap.xml"
